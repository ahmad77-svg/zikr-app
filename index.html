<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ذِكر - تحميل التطبيق</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #0f5a4c 0%, #0c4439 35%, #062f29 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 42px 28px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
    }

    .logo {
      font-size: 76px;
      font-weight: bold;
      color: #f4d58d;
      margin-bottom: 12px;
    }

    .verse {
      color: #f4d58d;
      font-size: 20px;
      line-height: 1.9;
      margin-bottom: 28px;
    }

    .description {
      color: rgba(255, 255, 255, 0.82);
      font-size: 16px;
      line-height: 1.9;
      margin-bottom: 32px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 22px;
      background: #f4d58d;
      color: #0c4439;
      text-decoration: none;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.25s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      background: #ffe6a7;
    }

    .info {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
      line-height: 1.7;
    }

    .version {
      margin-top: 24px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">ذِكر</div>

    <div class="verse">
      أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ
    </div>

    <div class="description">
      تطبيق ذِكر للأذكار اليومية، أذكار الصباح والمساء،
      أذكار النوم، التسابيح، الاستغفار، وأذكار يوم الجمعة.
    </div>

    <a
      class="download-btn"
      href="https://github.com/ahmad77-svg/zikr-app/releases/download/v1.0.0/zikr.apk"
    >
      تحميل التطبيق للأندرويد
    </a>

    <div class="info">
      بعد تحميل التطبيق قد يطلب منك Android السماح
      بتثبيت التطبيقات من هذا المصدر.
    </div>

    <div class="version">
      الإصدار 1.0.0
    </div>

  </main>

</body>
</html>
